<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 334</title>

    <!-- CSS Externo -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* Estilado CSS interno */
    </style>

    <!-- Forma mas moderna de cargar el archivo de JavaScript 
        - El atributo defer se encarga de que el script se descargue en paralelo con HTML 
        - Pero JavaScript solo se ejecutara despues de que toda la pagina termine de cargarse
        - Asi evitamos el bloqueo de renderizado y aseguramos que todo el documento este cargado antes de ejecutar el script
    -->
    <script defer src="js/index.js"></script>
</head>
<body>
    <h1 id="titulo">Introduccion a JavaScript</h1>

    <p class="mensaje">Primer parrafo</p>
    <p class="mensaje">Segundo parrafo</p>

    <button id="boton">Hace click maquina</button>

    <form class="borde">
        <input type="text" name="escribir" id="escribir">
    </form>

    <!-- Comprendiendo la propagacion de eventos -->
    <div id="padre" class="borde">
        <button id="hijo">Boton</button>
    </div>

    <!-- Como detener el envio por defecto de los formularios HTML -->
    <form class="borde" id="miFormulario">
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname"><br>

        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname"><br><br>

        <input type="submit" value="Submit">
    </form> 
      

    <!-- El lugar tradicional del script de JS es antes del </body> 
     
    <script src="js/index.js"></script>

    Tambien podemos cargar el JavaScript directamente adentro de <script>
    -->
</body>
</html>
